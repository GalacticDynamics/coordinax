name: CodSpeed

on:
  # Run on pushes to the main branch to keep a performance baseline.
  push:
    branches:
      - main
  # Run on pull requests to report performance changes.
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger a backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

concurrency:
  # Pushes to main get a group per commit, so merges never cancel each
  # other and main keeps a complete CI record. PRs still supersede.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    # OIDC tokens (`id-token: write`) are not issued to pull requests from
    # forks, so the CodSpeed auth would fail there. Skip forked PRs; the job
    # still runs on pushes, manual dispatch, and same-repo PRs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v6
        with:
          # Pin the interpreter so benchmark baselines aren't perturbed when the
          # runner's default Python changes. Matches the repo's `.python-version`.
          python-version: "3.12"

      - name: Install
        # `curveframes` is needed by `tests/benchmark/test_curveframes.py`; it
        # is the flagship `TimeDep` consumer and the only builder in the
        # project expensive enough to expose a redundant materialization.
        run: uv sync --no-default-groups --group test --extra benchmark --extra
          curveframes --locked

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          # `-W ignore:Signature:UserWarning` silences a numpy longdouble probe
          # warning that only appears under the CPU simulation instrument and
          # would otherwise be escalated to an error by `filterwarnings = error`.
          run: uv run --no-sync pytest tests/benchmark --codspeed -W "ignore:Signature:UserWarning"
