name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3
  PYTHON_VERSIONS: '["3.12", "3.13", "3.14"]'

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v6

      - name: Install
        run: uv sync --no-default-groups --group nox --group lint --locked

      - name: Lint & type-check
        run: uv run --frozen nox -s lint

  # Smoke test
  #
  # `coordinax` and each `packages/*` member carries a `tests/smoke/` folder of
  # fast, broad checks -- the package imports and every name in its `__all__`
  # resolves. This job runs only those, gating the full multi-OS/multi-Python
  # matrix below: it catches "the whole workspace is broken" in seconds instead
  # of waiting on the matrix to report it. `packages/*/tests/smoke` picks up new
  # workspace members automatically -- adding the folder is the only step.
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v6

      - name: Install
        run: uv sync --no-default-groups --extra workspace --group test --locked

      - name: Smoke test
        run: uv run --no-sync pytest -x tests/smoke packages/*/tests/smoke

  prepare_test_matrix:
    name: Prepare Test Matrix
    runs-on: ubuntu-latest
    needs: [format, smoke]
    permissions:
      contents: read
    outputs:
      python-all: ${{ steps.matrix.outputs.python-all }}
      python-edge: ${{ steps.matrix.outputs.python-edge }}
      exclude-args: ${{ steps.detect.outputs.exclude-args }}
      excluded-json: ${{ steps.detect.outputs.excluded-json }}
      status-json: ${{ steps.detect.outputs.status-json }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # `git diff <base>...HEAD` needs the base commit available locally.
          fetch-depth: 0

      - name: Detect optional package changes
        id: detect
        uses: ./.github/actions/detect-changed-packages
        with:
          config-file: .github/test-packages.json
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || 'origin/main' }}

      - name: Compute matrix versions
        id: matrix
        run: |
          python - <<'PY'
          import json
          import os

          versions = json.loads(os.environ["PYTHON_VERSIONS"])
          edge_versions = [versions[-1]]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"python-all={json.dumps(versions)}\n")
              f.write(f"python-edge={json.dumps(edge_versions)}\n")
          PY

  tests_linux:
    name: Check Python ${{ matrix.python-version }} on ubuntu-latest
    runs-on: ubuntu-latest
    needs: [prepare_test_matrix]
    # Well above a real run (4-16 min), and far below the 6h default. A stall
    # here has cost a runner for the better part of an hour more than once;
    # this bounds it, and `faulthandler_timeout` names the test before it hits.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.prepare_test_matrix.outputs.python-all) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --no-default-groups --group nox --group test --locked

      - name: Test package
        run: |
          uv run --no-sync nox -s test -- ${{ needs.prepare_test_matrix.outputs.exclude-args }} --cov --cov-report=xml --cov-report=term --durations=20 --arraydiff -m"not slow and not subprocess_heavy"

      - name: Upload coverage report
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-${{ github.run_id }}
          path: coverage.xml
          overwrite: true

  # These tests spawn their own interpreter, which has to cold-import the whole
  # JAX stack. Doing that beside xdist workers cold-importing the same stack
  # starved the child until it timed out, so they get a runner to themselves
  # rather than a serial step inside a matrix job.
  #
  # Every supported Python, not just the edge one: the interop test guards
  # registration across import orders, which is a property of the interpreter
  # and its import machinery, so a single version would not cover it. The job
  # runs in well under a minute and the versions run in parallel.
  #
  # `-n0` after nox's own `-n logical` wins, so the child runs alone; going
  # through nox rather than bare pytest keeps `--exclude-package` applied.
  tests_subprocess:
    name: Subprocess-heavy tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [prepare_test_matrix]
    # ~1 min in practice; these spawn children, so a stall is exactly the
    # failure mode this job exists to keep away from the parallel runs.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.prepare_test_matrix.outputs.python-all) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --no-default-groups --group nox --group test --locked

      - name: Test package (subprocess-heavy)
        run: |
          uv run --no-sync nox -s test -- -m"subprocess_heavy" -n0 --no-cov -q

  tests_nonlinux:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [prepare_test_matrix]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macos-latest, windows-latest]
        python-version: ${{ fromJSON(needs.prepare_test_matrix.outputs.python-edge) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --no-default-groups --group nox --group test --locked

      - name: Test package
        run: |
          uv run --no-sync nox -s test -- ${{ needs.prepare_test_matrix.outputs.exclude-args }} --cov --cov-report=xml --cov-report=term --durations=20 --arraydiff -m"not slow and not subprocess_heavy"

      - name: Upload coverage report
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  check_oldest:
    name: Check Oldest Dependencies
    runs-on: ${{ matrix.runs-on }}
    needs: [format, smoke]
    # The slowest job at ~20 min: it resolves downwards and excludes nothing.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --no-default-groups --group nox --locked

      - name: Test package
        run: >-
          uv run --no-sync nox -s test_oldest --
          --cov --cov-report=xml --cov-report=term --durations=20

      - name: Upload coverage report
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Docs (No Warnings)
    runs-on: ubuntu-latest
    needs: [format]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v6

      - name: Build docs (warnings as errors)
        run: uv run --frozen nox -s docs

  upload-coverage-python:
    name: Upload Python coverage to GitHub
    needs: [tests_linux]
    if: ${{ !cancelled() && needs.tests_linux.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-python-${{ github.run_id }}

      - name: Upload coverage to GitHub
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage-agent

  status:
    name: CI Pass
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      [
        format,
        smoke,
        tests_linux,
        tests_nonlinux,
        tests_subprocess,
        check_oldest,
        docs,
        upload-coverage-python,
      ]
    steps:
      - name: All required jobs passed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
