name: Refresh code graph

# Rebuilds graphify-out/graph.json and opens a pull request if it drifted from the code, e.g.
# because someone committed with SKIP=graphify-update. Never pushes to main: the graph is
# code-derived, but a bad rebuild is still a change nobody reviewed.
#
# This runs on Linux, and the graph is not byte-reproducible across platforms: the same source and
# pin give a few fewer __init__.py re-export edges here than on macOS. Nor is it reproducible
# across a built checkout and a fresh clone -- a generated `_version.py` is enough to move
# community numbering, even though no symbol comes from it. So a run after a commit from a
# contributor's working environment opens a pull request that only renumbers communities and
# normalises a few edges. That is the job working, not a bug; merging it makes the committed graph
# this runner's flavour until the next such commit. Expect it most weeks.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Rebuild graph
    runs-on: ubuntu-latest

    steps:
      # This repository's GITHUB_TOKEN is read-only and Actions is not permitted to open pull
      # requests, and there is no App or PAT here to copy, so the graph gets its own App.
      #
      # GRAPHIFY_APP_ID and GRAPHIFY_APP_PRIVATE_KEY do not exist yet: one App serves the whole
      # fleet of repositories on this profile and creating it is a one-time manual step. Until it
      # exists this job fails here, loudly, every Monday -- which is the signal that it is
      # unconfigured. That is deliberate: hiding the step behind `if: secrets.X != ''` would make
      # the job pass while doing nothing, and drift going unnoticed is the one thing it exists to
      # prevent. The App needs "Contents: Read and write" and "Pull requests: Read and write".
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.GRAPHIFY_APP_ID }}
          private-key: ${{ secrets.GRAPHIFY_APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v6

      # The version is pinned once, in .pre-commit-config.yaml, so this job clusters the graph
      # exactly the way the commit hook does.
      - name: Rebuild graph
        run: |
          # Require at least one digit and take the first hit, so a mention of the package in a
          # comment cannot be picked up as a second "pin".
          pin=$(grep -oE 'graphifyy==[0-9]+(\.[0-9]+)*' .pre-commit-config.yaml | head -1)
          if [ -z "$pin" ]; then
            echo "::error::no graphifyy== pin found in .pre-commit-config.yaml"
            exit 1
          fi
          echo "Rebuilding with $pin"
          PYTHONHASHSEED=0 uvx --from "$pin" graphify update . --force

      # `update` keeps the stored `built_at_commit` rather than rewriting it, and .graphifyignore
      # pins what is indexed, so on one platform a rebuild is byte-stable and a plain diff is a
      # true drift check. "No code-graph topology changes detected; outputs left untouched" in the
      # step above means no drift, not that the rebuild was skipped.
      - name: Check for drift
        id: drift
        run: |
          if git diff --quiet -- graphify-out/graph.json; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "The committed graph matches a fresh rebuild."
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            echo "The committed graph has drifted from the code."
          fi

      - name: Open pull request
        if: steps.drift.outputs.drifted == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          # main requires signed commits, and extra approval for unattributed changes. This
          # commits through the GitHub API, so GitHub signs it and attributes it to the App;
          # pushing with plain git would leave a pull request only an administrator could merge.
          sign-commits: true
          add-paths: graphify-out/graph.json
          # `cz-conventional-gitmoji` (the commitizen hook) requires the emoji that belongs to the
          # type, and the title becomes the squash subject.
          commit-message: "🧹 chore(graph): refresh the committed code graph"
          title: "🧹 chore(graph): refresh the committed code graph"
          body: |
            Rebuild of `graphify-out/graph.json`. Either the committed graph drifted from the code,
            or it was last built somewhere this runner cannot reproduce — graphify's output depends
            on which files are on disk and on the platform, so a built checkout and a fresh Linux
            clone disagree about community numbering and a few `__init__.py` re-export edges even
            when every symbol is identical.

            Generated output, one line, collapsed by GitHub. Nothing to review beyond a green
            build. `Milestone Check` is a required check here, so set a milestone before merging.
          branch: chore/refresh-graphify
          delete-branch: true
