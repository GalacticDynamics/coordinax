[project]
authors = [
  { name = "Coordinax Devs", email = "nstarman@users.noreply.github.com" },
  { name = "Nathaniel Starkman", email = "nstarman@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "coordinax>=0.24",
  "diffrax>=0.7",
  "diffraxtra>=1.5",
  "optimistix>=0.1.0",
]
description = "Curve-attached reference frames for coordinax"
dynamic = ["version"]
license = "MIT"
name = "coordinaxs.curveframes"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
# This distribution also ships the `coordinaxs.hypothesis.curveframes`
# strategy tree, which imports `hypothesis` and `coordinaxs.hypothesis`.
# Those are not needed to `import coordinaxs.curveframes`, so they are
# declared here rather than as hard dependencies:
#   pip install "coordinaxs.curveframes[hypothesis]"
hypothesis = ["coordinaxs.hypothesis>=0.24", "hypothesis>=6.148.7"]

[project.entry-points."coordinaxs.hypothesis"]
curveframes = "coordinaxs.hypothesis.curveframes:coordinaxs_hypothesis_exports"

[build-system]
build-backend = "hatchling.build"
requires      = ["hatch-vcs", "hatchling"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme              = "no-local-version"
root                      = "../.."
search_parent_directories = true

[tool.hatch.version.raw-options.scm.git]
describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "coordinaxs-curveframes-v*",
]

[tool.hatch.build.hooks.vcs]
version-file = "src/coordinaxs/curveframes/_version.py"
version-file-template = """\
version: str = {version!r}
version_tuple: tuple[int, int, int] | tuple[int, int, int, str, str]
version_tuple = {version_tuple!r}
"""

[tool.hatch.build.targets.wheel]
packages = ["src/coordinaxs"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["dataclassish", "quaxed", "unxt", "coordinax"]
known-local-folder = ["coordinaxs.curveframes"]
section-order = [
  "future",
  "standard-library",
  "typing",
  "third-party",
  "first-party",
  "local-folder",
]
sections = { typing = [
  "typing",
  "typing_extensions",
  "types",
  "collections.abc",
  "jaxtyping",
] }

[tool.uv.sources]
coordinax = { workspace = true }
