default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.12.1
    hooks:
      - id: commitizen
        additional_dependencies: [cz-conventional-gitmoji]

  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/scientific-python/cookie
    rev: 2025.11.21
    hooks:
      - id: sp-repo-review

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
        exclude: ^graphify-out/graph\.json$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: ^graphify-out/graph\.json$
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: no-commit-to-branch
        args: ["--branch", "main", "--pattern", "^versions/.*"]
        always_run: true
        # Restrict to pre-commit so a push (e.g. a release tag) isn't mistaken for a commit.
        stages: [pre-commit]
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: "v1.10.0"
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.38.0"
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-readthedocs

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.14.14"
    hooks:
      # Run the linter
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: ["--fix", "--show-fixes"]
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/adamchainz/blacken-docs
    rev: "1.20.0"
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==24.*]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "v3.8.1"
    hooks:
      - id: prettier
        name: prettier-markdown-no-wrap
        types_or: [markdown]
        args: [--prose-wrap=never]

      - id: prettier
        name: prettier-other
        types_or: [yaml, html, css, scss, javascript, json]
        exclude: ^graphify-out/graph\.json$

  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.1"
    hooks:
      - id: codespell
        args: ["--toml", "pyproject.toml"]
        additional_dependencies: ["tomli"]
        exclude: ^graphify-out/graph\.json$

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "v0.24.1"
    hooks:
      - id: validate-pyproject
        # additional_dependencies: ["validate-pyproject-schema-store[all]"]

  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check .
        language: system
        pass_filenames: false

      # Keeps the committed code graph (graphify-out/graph.json) in step with the code. Like a
      # formatter: if the graph changed, the commit stops -- stage the graph and commit again.
      # Skip once with `SKIP=graphify-update git commit ...`.
      #
      # This `graphifyy==` pin is the graph's only one: .github/workflows/graphify.yml reads the
      # version back out of this file, and `nox -s precommit` skips this hook, since a rebuild
      # over all files would fail for anyone whose platform differs from the one that built the
      # committed graph.
      - id: graphify-update
        name: graphify update
        language: python
        additional_dependencies: ["graphifyy==0.9.119"]
        entry: env PYTHONHASHSEED=0 graphify update . --force
        pass_filenames: false
        # Fires even on a commit that only deletes files -- otherwise the runner finds no
        # existing files to check, skips, and the deleted code stays in the graph. This also
        # makes any `exclude:` here inert, so there is none.
        always_run: true
        # `default_stages` above includes pre-push: without this the hook runs a second full
        # rebuild on every push, which can only repeat what the commit hook already enforced.
        stages: [pre-commit]
